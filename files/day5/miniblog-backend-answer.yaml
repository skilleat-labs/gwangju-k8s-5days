# 미니 블로그 backend (정답)
# 적용 순서: 이 파일을 먼저 (Namespace 가 들어 있다)
apiVersion: v1
kind: Namespace
metadata:
  name: webapp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-pvc
  namespace: webapp
spec:
  # storageClassName 을 생략하면 기본 StorageClass (Docker Desktop 은 hostpath) 를 쓴다
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: skilleat/backend:v3-kb5
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: blog-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: webapp
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
