apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
spec:
  selector:
    matchLabels: { app: app1 }
  template:
    metadata:
      labels: { app: app1 }
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0
        args: ["-text=app1"]
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector: { app: app1 }
  ports:
  - port: 80
    targetPort: 5678
