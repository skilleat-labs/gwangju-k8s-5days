apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  selector:
    matchLabels: { app: app2 }
  template:
    metadata:
      labels: { app: app2 }
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0
        args: ["-text=app2"]
---
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  selector: { app: app2 }
  ports:
  - port: 80
    targetPort: 5678
