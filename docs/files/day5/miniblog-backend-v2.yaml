# 미니 블로그 backend v2: 운영, 보안 설정을 붙인 Deployment (DAY 5 실습 5 STEP 28)
# miniblog-backend.yaml 을 적용한 뒤에 적용한다. Deployment 만 바뀐다 (롤링 업데이트).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webapp
spec:
  replicas: 1
  strategy:
    type: Recreate   # 파일 하나에 쓰는 백엔드: 새 Pod 전에 옛 Pod 를 먼저 끈다
  # 글을 파일 하나에 쓰는 앱 + ReadWriteOnce PVC: 옛 Pod 를 먼저 내리고 새 Pod 를 띄운다.
  # 업데이트 중 잠깐 API 가 멈추지만, 두 Pod 가 같은 파일에 동시에 쓰는 일이 없다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # API 서버를 쓰지 않는 앱이라 토큰을 꽂지 않는다 (DAY 5 섹션 2)
      automountServiceAccountToken: false
      containers:
      - name: backend
        image: skilleat/backend:v3-kb5
        ports:
        - containerPort: 5000
        # 5000 포트가 열리면 준비된 것으로 본다 (DAY 4)
        readinessProbe:
          tcpSocket:
            port: 5000
          periodSeconds: 5
        # 배치 기준과 메모리 한도 (DAY 4)
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: blog-pvc
