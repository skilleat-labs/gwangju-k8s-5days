# 미니 블로그 backend (정답)
# 적용 순서: 이 파일을 먼저 (Namespace 가 들어 있다)
apiVersion: v1
kind: Namespace
metadata:
  name: webapp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-pvc
  namespace: webapp
spec:
  # storageClassName 을 생략하면 기본 StorageClass (Docker Desktop 은 hostpath) 를 쓴다
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webapp
spec:
  replicas: 1
  strategy:
    type: Recreate   # 파일 하나에 쓰는 백엔드: 새 Pod 전에 옛 Pod 를 먼저 끈다
  # 글을 파일 하나에 쓰는 앱 + ReadWriteOnce PVC: 옛 Pod 를 먼저 내리고 새 Pod 를 띄운다.
  # 업데이트 중 잠깐 API 가 멈추지만, 두 Pod 가 같은 파일에 동시에 쓰는 일이 없다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: skilleat/backend:v3-kb5
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: blog-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: webapp
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
