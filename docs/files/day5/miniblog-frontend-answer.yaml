# 미니 블로그 frontend 와 입구 (정답)
# 적용 순서: miniblog-backend.yaml 다음에
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: skilleat/frontend:v3-kb5
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: webapp
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
---
# DAY 3 에 설치한 Envoy Gateway 가 맡는 GatewayClass
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: blog-gw-class
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: blog-gw
  namespace: webapp
spec:
  gatewayClassName: blog-gw-class
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: webapp
spec:
  parentRefs:
  - name: blog-gw
  rules:
  - backendRefs:
    - name: frontend-service
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
