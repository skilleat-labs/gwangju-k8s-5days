apiVersion: apps/v1
kind: Deployment
metadata: { name: secret-demo }
spec:
  selector: { matchLabels: { app: secret-demo } }
  template:
    metadata: { labels: { app: secret-demo } }
    spec:
      containers:
      - name: app
        image: nginx:1.27
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
